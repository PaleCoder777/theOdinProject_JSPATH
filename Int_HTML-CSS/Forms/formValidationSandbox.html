<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Sandbox</title>
    <style>
        body {
            background-color: darkgray;
            color: darkblue;
        }

        label,input,button {
            font-size: 20px;
        }
        
        /*
        input:invalid {
            border: 2px dashed red;
        }

        input:invalid:required {
            background-image: linear-gradient(to right, pink, lightgreen);
        }

        input:valid {
            border: 2px solid black;
        }
        */

        form {
            font: 1em sans-serif;
            max-width: 320px;
        }

        p > label {
            display: block;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        fieldset {
            width: 100%;
            border: 1px solid #333333;
            box-sizing: border-box;
        }

        input:invalid {
            box-shadow: 0 0 5px 1px red;
        }

        input:focus:invalid {
            box-shadow: none;
        }

    </style>
</head>
<body>

    <form>
        <label for="choose">Would you prefer a banana or a cherry? *</label>
        <input id="choose" name="i-like" required pattern="[Bb]*ananas?|[Cc]herry">
        <button>Submit</button>
    </form>

    <h1>------------------------------------------------------</h1>

    <form>
        <div>
            <label for="choose">Would your prefer a banana or a cherry? *</label>
            <input
                type="text"
                id="choose"
                name="i-like"
                required
                minlength="6"
                maxlength="6">
            </div>

            <div>
                <label for="number">How many would you like?</label>
                <input type="number" id="number" name="amount" value="1" min="1" max="10" step="0.1">
            </div>

            <div>
                <button>Submit</button>
            </div>
    </form>

    <h1>------------------------------------------------------</h1>

    <form>
        <p>Please complete all required (*) fields.</p>
        
        <fieldset>
            <legend>Do you have a driver's license?</legend>
            
            <input type="radio" required id="r1" name="driver" value="yes">
            <label for="r1">Yes</label>

            <input type="radio" required id="r2" name="driver" value="no">
            <label for="r2">No</label>
        </fieldset>

        <p>
            <label for="n1">How old are you?</label>
            <input type="number" min="12" max="120" step="1" id="n1" name="age">
        </p>

        <p>
            <label for="t1">What is your favorite fruit?</label>
            <input
                type="text"
                id="t1"
                name="fruit"
                list="l1"
                required
                pattern="[Bb]anana|[Cc]herry|[Aa]pple|[Ss]trawberry|[Ll]emon|[Oo]range">
            <datalist id="l1">
                <option value="Banana">Banana</option>
                <option value="Cherry">Cherry</option>
                <option value="Apple">Apple</option>
                <option value="Strawberry">Strawberry</option>
                <option value="Lemon">Lemon</option>
                <option value="Orange">Orange</option>
            </datalist>
        </p>

        <p>
            <label for="t2">What is your email address?</label>
            <input type="email" id="t2" name="email">
        </p>

        <p>
            <label for="t3">Leave a short message</label>
            <textarea name="msg" id="t3" maxlength="140" rows="5"></textarea>
        </p>

        <p>
            <button>Submit</button>
        </p>

    </form>

</body>
</html>
